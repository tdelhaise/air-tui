[package]
name = "xtask"
description = "Outillage du dépôt air-tui : tables Unicode, conformité des segmentations, et les trois contrôles de conventions."
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# ADR-005 : aucune dépendance **tierce**, ici non plus. Le téléchargement passe par
# `curl`, invoqué comme un processus — un outil présent partout, et qui n'entre pas dans le
# graphe de dépendances du framework.
#
# `air-tui` y figure parce que `check-segmentation` confronte la segmentation du framework
# aux essais officiels de l'annexe 29 : vérifier le code demande de l'appeler. La flèche va
# de l'outillage vers le framework, jamais l'inverse.
[dependencies]
air-tui = { path = "../crates/air-tui", version = "0.8.1" }

[lints]
workspace = true
