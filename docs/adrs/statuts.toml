# Avancement des ADR d'air-tui.
#
# Ce fichier est le SEUL endroit où vit l'avancement d'un ADR. Le champ `**Statut :**`
# que porte chaque fichier ADR décrit sa *décision* (Accepté / Proposé) : c'est une
# dimension distincte, à ne pas confondre.
#
# Valeurs admises pour `statut` :
#   fait        — mise en œuvre terminée
#   en-cours    — implémentation entamée, non close
#   a-faire     — décision actée, rien de commencé
#   permanent   — politique en vigueur continue, sans mise en œuvre à produire
#   a-qualifier — à trancher ; ne doit pas subsister durablement
#
# NOTE : le registre généré et son gate `--check`, repris d'Air, ne sont PAS en place.
# Les ADR sont pour l'instant en français seulement (traduction anglaise à produire).

["001"]
objet  = "Cibles tier-1 : Linux 6.1+ et macOS Sequoia 15+, x86_64 et aarch64"
statut = "permanent"
note   = "remplace la clause Linux-only d'ADR-004 d'Air, qui n'est pas reprise"

["002"]
objet  = "Architecture en couches et frontière unsafe portée par le découpage en crates"
statut = "en-cours"
note   = "découpage précisé par ADR-011 : trois crates au lieu de deux"

["003"]
objet  = "Entrée clavier à deux étages : terminal en tier-1, natif en complément local"
statut = "en-cours"
note   = "étage terminal et protocole Kitty écrits et fuzzés (M1, M2) ; étage natif en M8"

["004"]
objet  = "Conventions de nommage : aucune abréviation, préfixe Air sur le modèle d'objets"
statut = "permanent"
note   = "gate check-naming écrit et exécuté en CI (M6b) : il balaye les sites de déclaration, avec les quatre exceptions en liste blanche. Angle mort assumé : la liaison d'un bras de match"

["005"]
objet  = "Zéro dépendance : std plus six symboles de la libc déjà liée"
statut = "en-cours"
note   = "les six déclarations existent dans air-tui-platform-posix"

["006"]
objet  = "Unicode : tables UCD générées et committées"
statut = "fait"
note   = "largeur, graphèmes et segmentation en mots faits (M3, M6, Unicode 18.0.0) ; les deux segmentations passent les fichiers d'essais officiels sans écart, par cargo xtask check-segmentation"

["007"]
objet  = "MVC par journal de changements, sans Observer ni Rc/RefCell"
statut = "fait"
note   = "les quatre mécanismes existent et redit les emploie tous (M6) : journal AirChangeSet, compteurs AirGeneration, jeu de commandes interrogé au dessin, abonnement par AirViewId via find_mut. Éprouvé une fois de plus par l'annulation (M7h), qui n'a demandé aucun mécanisme de plus : le grisage des deux commandes est en pull, et aucun changement structurel n'a été ajouté. AirBinding, la part MVVM bornée aux dialogues, n'est pas écrite : AirPromptDialog possède ses contrôles directement, ce que l'ADR prévoit"

["008"]
objet  = "Moteur de thèmes : palette par rôles, glyphes, décorations ; thèmes compilés"
statut = "fait"
note   = "palette transcrite de Borland (quarante rôles depuis M7m, avec attributs depuis M7g), quantificateur, treize widgets colorés par rôles, thème MC et importeur de skins faits (M5, M5b, M6, M7a), coquille rmc faite (M7b) : les deux moitiés que l'ADR sépare existent séparément et se vérifient en deux lignes de commande. Les trente-neuf skins livrés avec mc 4.8.33 sont importables depuis M7g. Le choix du skin se fait par un nom depuis M7i, et AirDecorations — la troisième assiette du triplet — existe depuis M7j, avec son second champ depuis M7k : AirRole::ButtonShadow, transcrit à M5, a enfin un lecteur. Le quarantième rôle est le séparateur de colonnes d'une liste (M7m), que Borland nomme et qu'aucun des trente-neuf skins de mc ne décrit"

["009"]
objet  = "Versionnement semver, par crate, incrémenté à chaque PR qui touche la crate"
statut = "permanent"
note   = "gate check-versions écrit et exécuté en CI (M6b) : incrément des crates touchées, et cohérence des versions déclarées sur les dépendances par chemin"

["010"]
objet  = "Bordure par défaut sur les vues, retirable par border = false"
statut = "fait"
note   = "arbre de vues écrit (M4) ; content_bounds en place, et sept vues retirent la bordure dans leur constructeur — les petits contrôles, la vue d'édition, le bureau et l'écran (M5b, M6)"

["011"]
objet  = "Couture de plateforme par traits, une crate d'implémentation par plateforme"
statut = "en-cours"
note   = "le contrat et l'implémentation POSIX existent ; air-tui-platform-air reste à écrire"

["012"]
objet  = "Toute conversion de flux passe par un codec, tenu à 100 % de couverture"
statut = "en-cours"
note   = "sept codecs à 100 % des trois mesures, le décodeur est fuzzé, et le gate check-codec-coverage l'exige en CI (M6b)"

["013"]
objet  = "Accès typé dans l'arbre de vues : AirView hérite de Any"
statut = "fait"
note   = "find et find_mut rendent une vue avec son type (M6) ; c'est ce qui permet au contrôleur de redit de synchroniser sa vue d'édition sans référence arrière"

["014"]
objet  = "Annulation par journal de remplacements, une seule mutation primitive"
statut = "fait"
note   = "AirTextBuffer tient son historique et les sept chirurgies de lignes sont ramenées à une seule, splice (M7h) : le journal est une propriété de l'unique point de mutation, pas une couche posée à côté. Fusion par geste, borne à deux cent cinquante-six pas, drapeau de modification dérivé de l'historique. redit lie Ctrl+Z et Ctrl+R, et grise les deux commandes en pull"

["015"]
objet  = "Une vue ne peint pas hors de ses limites ; son propriétaire le fait pour elle"
statut = "fait"
note   = "l'ombre portée est peinte par le parent dans la boucle où il dessine ses enfants (M7j), et l'invariant du découpage n'a pas bougé. Le dépôt employait déjà la première des trois stratégies — la barre de menu agrandit ses limites pour contenir son déroulant depuis M5b. Les boutons en projettent depuis M7k, d'un autre genre — un trait fin en demi-blocs, une colonne au lieu de deux, et absent du thème de mc : c'est le premier champ de AirDecorations que les deux thèmes remplissent différemment"

["016"]
objet  = "La recherche : une question au modèle, une politique au contrôleur"
statut = "fait"
note   = "find_from est une méthode de lecture et non une action (M7l) : l'énumération de l'ADR-007 n'a pas bougé, et l'échec est une valeur de retour plutôt qu'un AirTextChange qui dirait qu'un rien a changé. Le bouclage et le dernier motif sont au contrôleur. L'unité de comparaison est la grappe de graphème, et le repliement de casse est simple et nommé"
