# Avancement des ADR d'air-tui.
#
# Ce fichier est le SEUL endroit où vit l'avancement d'un ADR. Le champ `**Statut :**`
# que porte chaque fichier ADR décrit sa *décision* (Accepté / Proposé) : c'est une
# dimension distincte, à ne pas confondre.
#
# Valeurs admises pour `statut` :
#   fait        — mise en œuvre terminée
#   en-cours    — implémentation entamée, non close
#   a-faire     — décision actée, rien de commencé
#   permanent   — politique en vigueur continue, sans mise en œuvre à produire
#   a-qualifier — à trancher ; ne doit pas subsister durablement
#
# NOTE : le registre généré et son gate `--check`, repris d'Air, ne sont PAS en place.
# Les ADR sont pour l'instant en français seulement (traduction anglaise à produire).

["001"]
objet  = "Cibles tier-1 : Linux 6.1+ et macOS Sequoia 15+, x86_64 et aarch64"
statut = "permanent"
note   = "remplace la clause Linux-only d'ADR-004 d'Air, qui n'est pas reprise"

["002"]
objet  = "Architecture en couches et frontière unsafe portée par le découpage en crates"
statut = "en-cours"
note   = "découpage précisé par ADR-011 : trois crates au lieu de deux"

["003"]
objet  = "Entrée clavier à deux étages : terminal en tier-1, natif en complément local"
statut = "en-cours"
note   = "étage terminal et protocole Kitty écrits et fuzzés (M1, M2) ; étage natif en M8"

["004"]
objet  = "Conventions de nommage : aucune abréviation, préfixe Air sur le modèle d'objets"
statut = "permanent"
note   = "gate check-naming écrit et exécuté en CI (M6b) : il balaye les sites de déclaration, avec les quatre exceptions en liste blanche. Angle mort assumé : la liaison d'un bras de match"

["005"]
objet  = "Zéro dépendance : std plus six symboles de la libc déjà liée"
statut = "en-cours"
note   = "les six déclarations existent dans air-tui-platform-posix"

["006"]
objet  = "Unicode : tables UCD générées et committées"
statut = "fait"
note   = "largeur, graphèmes et segmentation en mots faits (M3, M6, Unicode 18.0.0) ; les deux segmentations passent les fichiers d'essais officiels sans écart, par cargo xtask check-segmentation"

["007"]
objet  = "MVC par journal de changements, sans Observer ni Rc/RefCell"
statut = "fait"
note   = "les quatre mécanismes existent et redit les emploie tous (M6) : journal AirChangeSet, compteurs AirGeneration, jeu de commandes interrogé au dessin, abonnement par AirViewId via find_mut. AirBinding, la part MVVM bornée aux dialogues, n'est pas écrite : AirPromptDialog possède ses contrôles directement, ce que l'ADR prévoit"

["008"]
objet  = "Moteur de thèmes : palette par rôles, glyphes, décorations ; thèmes compilés"
statut = "en-cours"
note   = "palette transcrite de Borland, quantificateur, onze widgets colorés par rôles, thème MC et importeur de skins faits (M5, M5b, M6, M7). Reste : AirDecorations, la troisième assiette du triplet, que l'ombre portée demande et que le découpage du peintre interdit aujourd'hui ; et la coquille rmc"

["009"]
objet  = "Versionnement semver, par crate, incrémenté à chaque PR qui touche la crate"
statut = "permanent"
note   = "gate check-versions écrit et exécuté en CI (M6b) : incrément des crates touchées, et cohérence des versions déclarées sur les dépendances par chemin"

["010"]
objet  = "Bordure par défaut sur les vues, retirable par border = false"
statut = "fait"
note   = "arbre de vues écrit (M4) ; content_bounds en place, et sept vues retirent la bordure dans leur constructeur — les petits contrôles, la vue d'édition, le bureau et l'écran (M5b, M6)"

["011"]
objet  = "Couture de plateforme par traits, une crate d'implémentation par plateforme"
statut = "en-cours"
note   = "le contrat et l'implémentation POSIX existent ; air-tui-platform-air reste à écrire"

["012"]
objet  = "Toute conversion de flux passe par un codec, tenu à 100 % de couverture"
statut = "en-cours"
note   = "six codecs à 100 % des trois mesures, le décodeur est fuzzé, et le gate check-codec-coverage l'exige en CI (M6b)"

["013"]
objet  = "Accès typé dans l'arbre de vues : AirView hérite de Any"
statut = "fait"
note   = "find et find_mut rendent une vue avec son type (M6) ; c'est ce qui permet au contrôleur de redit de synchroniser sa vue d'édition sans référence arrière"
