[package]
name = "air-tui-platform-posix"
description = "Implémentation POSIX du contrat de plateforme d'air-tui : l'unique endroit où vivent `unsafe` et les appels à la bibliothèque C."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# ADR-005 : aucune dépendance tierce. Les appels système viennent de la bibliothèque C que
# `std` lie déjà — glibc sur *-linux-gnu, libSystem sur *-apple-darwin.
[dependencies]
air-tui-platform = { path = "../air-tui-platform", version = "0.1.0" }

[lints]
workspace = true
