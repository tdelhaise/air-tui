[package]
name = "rmc"
description = "Coquille à deux panneaux en mode terminal, équivalent de Midnight Commander, bâtie sur air-tui."
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["file-manager", "tui", "terminal", "midnight-commander"]
categories = ["command-line-utilities", "filesystem"]

# C'est le **binaire final** qui choisit une implémentation de plateforme et l'injecte
# (ADR-011). Le cœur du framework ne connaît que le contrat ; cette crate est le seul
# endroit de l'arborescence `rmc` où `air-tui-platform-posix` paraît.
[dependencies]
air-tui = { path = "../air-tui", version = "0.15.0" }
air-tui-platform-posix = { path = "../air-tui-platform-posix", version = "0.2.0" }

[lints]
workspace = true

[[bin]]
name = "rmc"
path = "src/main.rs"
