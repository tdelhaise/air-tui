[package]
name = "air-tui"
description = "Framework d'interface en mode texte, sans dépendance, à thèmes graphiques (Turbo Vision, Midnight Commander)."
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["tui", "terminal", "turbo-vision", "widgets", "theme"]
categories = ["command-line-interface"]

# ADR-005 : aucune dépendance tierce. ADR-011 : le cœur ne dépend QUE du contrat de
# plateforme — jamais d'une implémentation. C'est ce qui l'empêche d'atteindre le système,
# et ce qui rendra le portage sur `linux-air` transparent pour lui.
[dependencies]
air-tui-platform = { path = "../air-tui-platform", version = "0.1.0" }

# L'exemple choisit une plateforme ; le cœur, lui, n'en dépend pas.
[dev-dependencies]
air-tui-platform-posix = { path = "../air-tui-platform-posix", version = "0.1.0" }

[lints]
workspace = true

[[example]]
name = "frame"
path = "examples/frame.rs"
