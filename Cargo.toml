# Espace de travail air-tui.
#
# Quatre crates, et la couture entre les trois premières est la règle structurante du projet
# (cf. `ADR-002-architecture-en-couches-fr.md` et `ADR-011-couture-de-plateforme-fr.md`) :
#
# - `air-tui-platform`        — le contrat : des traits, zéro `unsafe`, zéro appel C ;
# - `air-tui-platform-posix`  — couche 0 POSIX : le SEUL `unsafe`, le SEUL appel C ;
# - `air-tui`                 — le cœur : ne dépend QUE du contrat ;
# - `redit`                   — l'application : le SEUL endroit qui choisit une plateforme.
#
# `air-tui` n'a pas de dépendance vers une implémentation de plateforme : elle ne peut
# donc pas atteindre le système, même par accident. C'est le binaire final qui choisit
# une implémentation et l'injecte. La cible `linux-air` recevra sa propre crate
# d'implémentation sans qu'une ligne du cœur ne change.

[workspace]
resolver = "3"
members = [
    "crates/air-tui-platform",
    "crates/air-tui-platform-posix",
    "crates/air-tui",
    "crates/redit",
    "crates/rmc",
    "xtask",
]

[workspace.package]
# Pas de `version` partagée ici : chaque crate porte la sienne et évolue à son rythme
# (ADR-009 — versionnement semver par crate).
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/tdelhaise/air-tui"
authors = ["Thierry Delhaise"]

# Arithmétique défensive (Principe 2 d'Air) : l'opération nue est refusée, la conversion
# lossy par `as` est refusée. Le code choisit explicitement checked_* / saturating_* /
# wrapping_* selon la sémantique, et `TryFrom` pour les conversions.
[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_possible_wrap = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
pedantic = { level = "warn", priority = -1 }
# Suggérer `#[must_use]` sur chaque accesseur `const fn` d'une structure de coordonnées
# produit du bruit sans rien révéler : la valeur rendue est évidemment la seule raison
# d'appeler `column()`.
must_use_candidate = "allow"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
